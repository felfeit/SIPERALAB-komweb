<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Formulir peminjaman SIPERALAB" />
    <title>SIPERALAB | Peminjaman</title>

    <link rel="stylesheet" href="/src/styles.css" />
    <link rel="icon" type="image/x-icon" href="/images/siperalab-favicon.png" />
  </head>
  <body>
    <header class="site-header">
      <a href="/" class="brand">SIPERALAB</a>
      <nav aria-label="Navigasi utama">
        <a href="/">Beranda</a>
        <a href="/peralatan.html">Peralatan</a>
        <a href="/tentang.html">Tentang</a>
        <a href="/peminjaman.html">Ajukan Peminjaman</a>
      </nav>
    </header>

    <main>
      <h1 class="hero-title">Ajukan Peminjaman</h1>
      <p class="hero-desc">
        Isi data berikut. Pada Modul 2 formulir belum disimpan ke backend;
        fokusnya adalah struktur, label, nama data, dan validasi HTML.
      </p>

      <form action="/peminjaman" method="post" class="form-peminjaman">
        <fieldset>
          <legend>Data peminjam</legend>

          <div class="form-group">
            <label for="nim">NIM</label>
            <input
              id="nim"
              name="nim"
              type="text"
              inputmode="numeric"
              pattern="[0-9]{10}"
              maxlength="10"
              required
              placeholder="Masukkan 10 digit NIM"
            />
          </div>

          <div class="form-group">
            <label for="nama">Nama lengkap</label>
            <input
              id="nama"
              name="nama"
              type="text"
              autocomplete="name"
              minlength="3"
              required
              placeholder="Masukkan nama lengkap"
            />
          </div>
        </fieldset>

        <fieldset>
          <legend>Detail peminjaman</legend>

          <div class="form-group">
            <label for="alat">Peralatan</label>
            <select id="alat" name="alat" required>
              <option value="">-- Pilih peralatan --</option>
              <option value="multimeter">Multimeter Digital</option>
              <option value="router">Router</option>
              <option value="kamera">Kamera</option>
            </select>
          </div>

          <div class="form-group">
            <label for="tanggal-pinjam">Tanggal peminjaman</label>
            <input
              id="tanggal-pinjam"
              name="tanggal_pinjam"
              type="date"
              required
            />
          </div>

          <div class="form-group">
            <label for="durasi">Durasi peminjaman (hari)</label>
            <p id="durasi-hint" class="hint">Durasi 1 sampai 7 hari.</p>
            <input
              id="durasi"
              name="durasi"
              type="number"
              min="1"
              max="7"
              aria-describedby="durasi-hint"
              required
            />
          </div>

          <div class="form-group">
            <label for="keperluan">Keperluan</label>
            <textarea
              id="keperluan"
              name="keperluan"
              minlength="10"
              maxlength="300"
              rows="5"
              required
              placeholder="Jelaskan keperluan peminjaman alat (min. 10 karakter)"
            ></textarea>
          </div>
        </fieldset>

        <div class="form-checkbox">
          <input
            id="setuju"
            name="setuju"
            type="checkbox"
            value="ya"
            required
          />
          <label for="setuju"
            >Saya menyetujui aturan peminjaman laboratorium.</label
          >
        </div>

        <button type="submit" class="btn-primary">Kirim pengajuan</button>
      </form>
    </main>

    <footer>
      <p><a href="/peralatan.html">Kembali ke katalog</a></p>
    </footer>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
