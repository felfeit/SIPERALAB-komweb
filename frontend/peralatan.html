<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Daftar peralatan SIPERALAB" />
    <title>SIPERALAB | Peralatan</title>

    <link rel="stylesheet" href="/src/styles.css" />
    <link rel="icon" type="image/x-icon" href="/images/siperalab-favicon.png" />
  </head>
  <body>
    <header class="site-header">
      <a href="/" class="brand">SIPERALAB</a>
      <nav aria-label="Navigasi utama">
        <a href="/">Beranda</a>
        <a href="/peralatan.html">Peralatan</a>
        <a href="/tentang.html">Tentang</a>
        <a href="/peminjaman.html">Ajukan Peminjaman</a>
      </nav>
    </header>

    <main>
      <h1 class="hero-title">Katalog Peralatan</h1>

      <section aria-labelledby="judul-katalog">
        <h2 id="judul-katalog" class="section-title">
          Peralatan yang dapat dipinjam
        </h2>

        <div class="card-grid">
          <article class="card">
            <h3>Multimeter Digital</h3>
            <figure class="card-img-container">
              <img
                src="/images/multimeter.png"
                alt="Multimeter digital untuk pengukuran listrik"
                class="card-img"
              />
              <figcaption class="sr-only">
                Alat ukur tegangan, arus, dan resistansi.
              </figcaption>
            </figure>
            <p><strong>Stok:</strong> 6 unit</p>
            <p><strong>Kondisi:</strong> Baik</p>
          </article>

          <article class="card">
            <h3>Router</h3>
            <figure class="card-img-container">
              <img
                src="/images/router.png"
                alt="Router jaringan untuk praktikum konfigurasi jaringan"
                class="card-img"
              />
              <figcaption class="sr-only">
                Perangkat jaringan untuk latihan routing dan konektivitas.
              </figcaption>
            </figure>
            <p><strong>Stok:</strong> 12 unit</p>
            <p><strong>Kondisi:</strong> Baik</p>
          </article>

          <article class="card">
            <h3>Kamera</h3>
            <figure class="card-img-container">
              <img
                src="/images/kamera.png"
                alt="Kamera digital untuk dokumentasi kegiatan laboratorium"
                class="card-img"
              />
              <figcaption class="sr-only">
                Kamera digital untuk dokumentasi dan kebutuhan praktikum.
              </figcaption>
            </figure>
            <p><strong>Stok:</strong> 5 unit</p>
            <p><strong>Kondisi:</strong> Baik</p>
          </article>
        </div>
      </section>
    </main>

    <footer>
      <p><a href="/">Kembali ke beranda</a></p>
      <p><a href="/peminjaman.html">Lanjut ke formulir peminjaman</a></p>
    </footer>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
